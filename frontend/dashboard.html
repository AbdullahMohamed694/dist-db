<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DistDB Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container py-4">
    <h1 class="mb-4">DistDB Dashboard</h1>

    <!-- Manual Refresh Button -->
    <div class="mb-3">
        <button class="btn btn-secondary" onclick="refreshAll()">Refresh Now</button>
        <small class="text-muted ms-2">Auto‑refresh disabled</small>
    </div>

    <!-- Worker Status -->
    <div class="card mb-4">
        <div class="card-header">Worker Nodes</div>
        <div class="card-body">
            <table class="table" id="worker-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Address</th>
                        <th>Status</th>
                        <th>Last Heartbeat</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- Database Operations -->
    <div class="card mb-4">
        <div class="card-header">Databases</div>
        <div class="card-body">
            <div class="row">
                <div class="col-auto">
                    <select id="db-select" class="form-select" onchange="onDatabaseSelect()">
                        <option value="">-- Select database --</option>
                    </select>
                </div>
                <div class="col-auto">
                    <input type="text" id="new-db-name" class="form-control" placeholder="New DB name">
                    <button id="create-db-btn" class="btn btn-success mt-2" onclick="createDatabase()">Create
                        DB</button>
                </div>
                <div class="col-auto">
                    <button id="drop-db-btn" class="btn btn-danger mt-2" onclick="dropDatabase()">Drop Selected
                        DB</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Table Operations (shown when a DB is selected) -->
    <div id="table-section" class="card mb-4" style="display:none;">
        <div class="card-header">Tables for <span id="selected-db-name"></span></div>
        <div class="card-body">
            <div class="row">
                <div class="col-auto">
                    <select id="table-select" class="form-select" onchange="onTableSelect()">
                        <option value="">-- Select table --</option>
                    </select>
                </div>
                <div class="col-auto">
                    <button id="create-table-btn" class="btn btn-primary" data-bs-toggle="modal"
                        data-bs-target="#createTableModal">Create Table</button>
                </div>
                <div class="col-auto">
                    <button id="delete-table-btn" class="btn btn-danger" onclick="deleteTable()">Delete Selected
                        Table</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Row Operations (shown when a table is selected) -->
    <div id="row-section" class="card" style="display:none;">
        <div class="card-header">Rows of <span id="selected-table-name"></span></div>
        <div class="card-body">
            <button class="btn btn-info mb-3" onclick="loadRows()">Refresh Rows</button>
            <button class="btn btn-success mb-3" onclick="showInsertForm()">Insert Row</button>
            <table class="table" id="row-table">
                <thead id="row-thead"></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- Modal: Create Table -->
    <div class="modal fade" id="createTableModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5>Create Table</h5><button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="new-table-name" class="form-control" placeholder="Table name">
                    <div class="mt-2" id="columns-container">
                        <div class="row mb-2">
                            <div class="col"><input class="form-control col-name" placeholder="Column name"></div>
                            <div class="col"><input class="form-control col-type"
                                    placeholder="Type (e.g. VARCHAR(100))"></div>
                        </div>
                    </div>
                    <button class="btn btn-sm btn-secondary" onclick="addColumnField()">+ Add column</button>
                    <button class="btn btn-primary mt-2" onclick="createTable()">Create</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Insert Row -->
    <div class="modal fade" id="insertRowModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5>Insert Row</h5><button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="insert-form-container"></div>
                <div class="modal-footer">
                    <button class="btn btn-primary" onclick="insertRow()">Insert</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Update Row -->
    <div class="modal fade" id="updateRowModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5>Update Row</h5><button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="update-form-container"></div>
                <div class="modal-footer">
                    <button class="btn btn-primary" onclick="updateRow()">Update</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ---------- API Key ----------
        const API_KEY = 'distdb-secret-key-2026';   // must match the key set on all nodes

        // Helper that returns headers with the API key
        function apiHeaders(method = null) {
            const h = { 'X-API-Key': API_KEY };
            if (method === 'POST' || method === 'PUT' || method === 'DELETE') {
                h['Content-Type'] = 'application/json';
            }
            return h;
        }

        // ---------- Globals ----------
        let currentDB = '', currentTable = '';
        let currentTableSchema = [];
        let isMasterNode = false;

        // ---------- Detect if this node is master ----------
        async function checkIfMaster() {
            try {
                const resp = await fetch('/api/workers', { headers: apiHeaders() });
                if (resp.ok) {
                    isMasterNode = true;
                } else {
                    isMasterNode = false;
                }
            } catch (e) {
                isMasterNode = false;
            }

            const dropDbBtn = document.getElementById('drop-db-btn');

            // Only Drop DB is hidden on workers
            if (!isMasterNode) {
                if (dropDbBtn) dropDbBtn.style.display = 'none';
            } else {
                if (dropDbBtn) dropDbBtn.style.display = '';
            }
            // All other buttons (create-db-btn, create-table-btn, delete-table-btn) always visible
        }

        // ---------- Refresh everything manually ----------
        async function refreshAll() {
            await checkIfMaster();
            loadWorkers();
            loadDatabases();
            if (currentDB) loadTables();
            if (currentTable) loadRows();
        }

        // ---------- Initial loads ----------
        async function init() {
            await checkIfMaster();
            loadWorkers();
            loadDatabases();
        }
        init();

        // ---------- Workers ----------
        async function loadWorkers() {
            const tbody = document.querySelector('#worker-table tbody');
            tbody.innerHTML = '';

            let masterStatus = 'unknown';
            try {
                const masterResp = await fetch('/health', { headers: apiHeaders() });
                const masterData = await masterResp.json();
                masterStatus = masterData.status === 'ok' ? 'up' : 'down';
            } catch (e) {
                masterStatus = 'down';
            }
            tbody.innerHTML += `<tr>
                <td><strong>master</strong></td>
                <td>${window.location.origin}</td>
                <td><span class="badge bg-${masterStatus === 'up' ? 'success' : 'danger'}">${masterStatus}</span></td>
                <td>—</td>
                <td></td>
            </tr>`;

            if (isMasterNode) {
                try {
                    const resp = await fetch('/api/workers', { headers: apiHeaders() });
                    const data = await resp.json();
                    (data.workers || []).forEach(w => {
                        const promoteBtn = `<button class="btn btn-sm btn-warning" onclick="promoteWorker('${w.address}')">Promote</button>`;
                        tbody.innerHTML += `<tr>
                            <td>${w.name}</td>
                            <td>${w.address}</td>
                            <td><span class="badge bg-${w.status === 'up' ? 'success' : 'danger'}">${w.status}</span></td>
                            <td>${w.last_heartbeat || 'never'}</td>
                            <td>${promoteBtn}</td>
                        </tr>`;
                    });
                } catch (e) { }
            }
        }

        async function promoteWorker(addr) {
            if (!confirm('Promote ' + addr + ' to master?')) return;
            try {
                const resp = await fetch(addr + '/api/node/promote', {
                    method: 'POST',
                    headers: apiHeaders('POST')
                });
                const data = await resp.json();
                alert(data.message || 'Promotion successful');
                loadWorkers();
            } catch (e) {
                alert('Promotion failed: ' + e);
            }
        }

        // ---------- Databases ----------
        async function loadDatabases() {
            const resp = await fetch('/api/databases', { headers: apiHeaders() });
            const data = await resp.json();
            const select = document.getElementById('db-select');
            select.innerHTML = '<option value="">-- Select database --</option>';
            (data.databases || []).forEach(db => {
                select.innerHTML += `<option value="${db}">${db}</option>`;
            });
        }

        function onDatabaseSelect() {
            currentDB = document.getElementById('db-select').value;
            document.getElementById('table-section').style.display = currentDB ? '' : 'none';
            document.getElementById('row-section').style.display = 'none';
            if (currentDB) {
                document.getElementById('selected-db-name').innerText = currentDB;
                loadTables();
            }
        }

        async function loadTables() {
            if (!currentDB) return;
            const resp = await fetch(`/api/databases/${currentDB}/tables`, { headers: apiHeaders() });
            const data = await resp.json();
            const select = document.getElementById('table-select');
            select.innerHTML = '<option value="">-- Select table --</option>';
            (data.tables || []).forEach(t => {
                select.innerHTML += `<option value="${t}">${t}</option>`;
            });
        }

        function onTableSelect() {
            currentTable = document.getElementById('table-select').value;
            document.getElementById('row-section').style.display = currentTable ? '' : 'none';
            if (currentTable) {
                document.getElementById('selected-table-name').innerText = currentTable;
                loadTableSchema().then(() => loadRows());
            }
        }

        async function loadTableSchema() {
            if (!currentDB || !currentTable) return;
            const resp = await fetch(`/api/databases/${currentDB}/tables/${currentTable}/schema`, { headers: apiHeaders() });
            const data = await resp.json();
            currentTableSchema = data.columns || [];
        }

        // ---------- Rows ----------
        async function loadRows() {
            if (!currentDB || !currentTable) return;
            const resp = await fetch(`/api/databases/${currentDB}/tables/${currentTable}/rows`, { headers: apiHeaders() });
            const data = await resp.json();
            const thead = document.getElementById('row-thead');
            const tbody = document.querySelector('#row-table tbody');
            thead.innerHTML = '';
            tbody.innerHTML = '';

            if (!data.rows || data.rows.length === 0) {
                tbody.innerHTML = '<tr><td colspan="100%">No rows</td></tr>';
                return;
            }

            const columns = Object.keys(data.rows[0]);
            let headerRow = '<tr>';
            columns.forEach(c => headerRow += `<th>${c}</th>`);
            headerRow += '<th>Actions</th></tr>';
            thead.innerHTML = headerRow;

            data.rows.forEach(row => {
                let tr = '<tr>';
                columns.forEach(c => tr += `<td>${row[c]}</td>`);
                tr += `<td>
                    <button class="btn btn-sm btn-warning" onclick='editRow("${row.id}")'>Edit</button>
                    <button class="btn btn-sm btn-danger" onclick='deleteRow("${row.id}")'>Delete</button>
                </td></tr>`;
                tbody.innerHTML += tr;
            });
        }

        // ---------- Insert ----------
        async function showInsertForm() {
            if (!currentTableSchema.length) await loadTableSchema();
            if (!currentTableSchema.length) {
                alert('Could not load table schema');
                return;
            }
            const container = document.getElementById('insert-form-container');
            container.innerHTML = '';
            currentTableSchema.forEach(col => {
                if (col.name === 'id') return;
                container.innerHTML += `<div class="mb-3">
                    <label>${col.name} (${col.type})</label>
                    <input class="form-control insert-field" data-name="${col.name}">
                </div>`;
            });
            new bootstrap.Modal(document.getElementById('insertRowModal')).show();
        }

        async function insertRow() {
            const fields = document.querySelectorAll('.insert-field');
            const body = {};
            fields.forEach(f => { if (f.value !== '') body[f.dataset.name] = f.value; });
            const resp = await fetch(`/api/databases/${currentDB}/tables/${currentTable}/rows`, {
                method: 'POST',
                headers: apiHeaders('POST'),
                body: JSON.stringify(body)
            });
            if (!resp.ok) {
                const err = await resp.text();
                alert('Insert failed: ' + err);
                return;
            }
            bootstrap.Modal.getInstance(document.getElementById('insertRowModal')).hide();
            loadRows();
        }

        // ---------- Edit ----------
        let editingRowId = null;
        async function editRow(id) {
            editingRowId = id;
            const resp = await fetch(`/api/databases/${currentDB}/tables/${currentTable}/rows?where=id='${id}'`, { headers: apiHeaders() });
            const data = await resp.json();
            if (!data.rows || data.rows.length === 0) {
                alert('Row not found');
                return;
            }
            const row = data.rows[0];
            const container = document.getElementById('update-form-container');
            container.innerHTML = '';
            Object.keys(row).forEach(key => {
                if (key === 'id') return;
                container.innerHTML += `<div class="mb-3">
                    <label>${key}</label>
                    <input class="form-control update-field" data-name="${key}" value="${row[key] || ''}">
                </div>`;
            });
            new bootstrap.Modal(document.getElementById('updateRowModal')).show();
        }

        async function updateRow() {
            const fields = document.querySelectorAll('.update-field');
            const body = {};
            fields.forEach(f => { body[f.dataset.name] = f.value; });
            const resp = await fetch(`/api/databases/${currentDB}/tables/${currentTable}/rows/${editingRowId}`, {
                method: 'PUT',
                headers: apiHeaders('PUT'),
                body: JSON.stringify(body)
            });
            if (!resp.ok) {
                const err = await resp.text();
                alert('Update failed: ' + err);
                return;
            }
            bootstrap.Modal.getInstance(document.getElementById('updateRowModal')).hide();
            loadRows();
        }

        // ---------- Delete Row ----------
        async function deleteRow(id) {
            if (!confirm('Are you sure?')) return;
            await fetch(`/api/databases/${currentDB}/tables/${currentTable}/rows/${id}`, {
                method: 'DELETE',
                headers: apiHeaders('DELETE')
            });
            loadRows();
        }

        // ---------- Database CRUD ----------
        async function createDatabase() {
            const name = document.getElementById('new-db-name').value;
            if (!name) return alert('Name required');
            await fetch('/api/databases', {
                method: 'POST',
                headers: apiHeaders('POST'),
                body: JSON.stringify({ name })
            });
            document.getElementById('new-db-name').value = '';
            loadDatabases();
        }

        async function dropDatabase() {
            if (!isMasterNode) {
                alert('Only the master can drop databases. Please connect to the master node.');
                return;
            }
            if (!currentDB) return alert('Select a database first');
            if (!confirm(`Really drop database ${currentDB}?`)) return;
            await fetch(`/api/databases/${currentDB}`, {
                method: 'DELETE',
                headers: apiHeaders('DELETE')
            });
            currentDB = '';
            document.getElementById('db-select').value = '';
            document.getElementById('table-section').style.display = 'none';
            document.getElementById('row-section').style.display = 'none';
            loadDatabases();
        }

        async function deleteTable() {
            if (!currentDB || !currentTable) return alert('Select a table first');
            if (!confirm(`Really drop table ${currentTable}?`)) return;
            await fetch(`/api/databases/${currentDB}/tables/${currentTable}`, {
                method: 'DELETE',
                headers: apiHeaders('DELETE')
            });
            currentTable = '';
            document.getElementById('table-select').value = '';
            document.getElementById('row-section').style.display = 'none';
            loadTables();
        }

        // ---------- Table creation helpers ----------
        function addColumnField() {
            const container = document.getElementById('columns-container');
            container.innerHTML += `<div class="row mb-2">
                <div class="col"><input class="form-control col-name" placeholder="Column name"></div>
                <div class="col"><input class="form-control col-type" placeholder="Type"></div>
            </div>`;
        }

        async function createTable() {
            const tableName = document.getElementById('new-table-name').value;
            if (!tableName) return alert('Table name required');
            const colNames = document.querySelectorAll('.col-name');
            const colTypes = document.querySelectorAll('.col-type');
            const columns = [];
            for (let i = 0; i < colNames.length; i++) {
                if (colNames[i].value && colTypes[i].value) {
                    columns.push({ name: colNames[i].value, type: colTypes[i].value });
                }
            }
            await fetch(`/api/databases/${currentDB}/tables`, {
                method: 'POST',
                headers: apiHeaders('POST'),
                body: JSON.stringify({ name: tableName, columns })
            });
            bootstrap.Modal.getInstance(document.getElementById('createTableModal')).hide();
            loadTables();
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
